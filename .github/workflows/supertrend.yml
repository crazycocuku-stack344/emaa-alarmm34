name: supertrend-alert

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Ayni anda tek calisma. Biri bitince siradaki hemen baslar, boylece bot kesintisiz doner.
concurrency:
  group: supertrend-alert
  cancel-in-progress: false

env:
  # COINLER: Binance Alpha sembolu. Alpha'da yoksa Binance Spot'ta (COINUSDT) aranir. Mantra'nin spot sembolu OM.
  # Bu satiri GitHub'da duzenleyip commit edersen bot 1 dakika icinde yeni listeyi alir (cift tirnagi koru).
  COINS: "AKE,EVAA,PIEVERSE,SKYAI,OM,ARIA,ZEUS,VINE,BLUR,DOS,H,INIT"
  # live  = mum kapanmadan, Supertrend yesile dondugu an bildir (anlik, ama mum kapanmadan geri donebilir)
  # close = mum kapanisinda onaylayip bildir (daha guvenli, en fazla 1 dk gec)
  MODE: "live"
  INTERVAL: "1m"
  ATR_PERIOD: "10"
  MULTIPLIER: "3"
  POLL_SECONDS: "10"
  FRESH_SECONDS: "60"
  SYNC_SECONDS: "60"
  RUN_MINUTES: "330"
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - name: Supertrend dongusu
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, time, urllib.error, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timedelta, timezone

          STATE = "state.json"
          WORKFLOW_FILE = ".github/workflows/supertrend.yml"
          TOPIC = os.environ.get("NTFY_TOPIC", "").strip()
          MODE = os.environ.get("MODE", "live").strip().lower()
          INTERVAL = os.environ.get("INTERVAL", "1m")
          PERIOD = int(os.environ.get("ATR_PERIOD", "10"))
          MULT = float(os.environ.get("MULTIPLIER", "3"))
          POLL = float(os.environ.get("POLL_SECONDS", "10"))
          SYNC = float(os.environ.get("SYNC_SECONDS", "60"))
          FRESH_MS = int(float(os.environ.get("FRESH_SECONDS", "60")) * 1000)
          RUN_SECONDS = float(os.environ.get("RUN_MINUTES", "330")) * 60
          INTERVAL_MS = int(INTERVAL[:-1]) * {"s": 1000, "m": 60000, "h": 3600000}[INTERVAL[-1]]

          ALPHA_BASE = "https://www.binance.com/bapi/defi/v1/public"
          TOKEN_LIST = ALPHA_BASE + "/wallet-direct/buw/wallet/cex/alpha/all/token/list"
          ALPHA_KLINES = ALPHA_BASE + "/alpha-trade/klines"
          SPOT_KLINES = "https://data-api.binance.vision/api/v3/klines"
          TR_TZ = timezone(timedelta(hours=3))
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          def log(msg):
              print(datetime.now(TR_TZ).strftime("%H:%M:%S"), msg, flush=True)

          def parse_coins(text):
              out = []
              for c in text.split(","):
                  c = c.strip().upper()
                  if c and c not in out:
                      out.append(c)
              return out

          def http_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.load(r)

          _tok = {"data": None, "at": 0.0}
          def tokens():
              if _tok["data"] is None or time.time() - _tok["at"] > 1800:
                  try:
                      j = http_json(TOKEN_LIST)
                      if str(j.get("code")) != "000000":
                          raise RuntimeError(f"token listesi alinamadi: {j.get('message')}")
                      _tok["data"] = j["data"]
                      _tok["at"] = time.time()
                  except Exception:
                      if _tok["data"] is None:
                          raise
              return _tok["data"]

          def vol(t):
              try:
                  return float(t.get("volume24h") or 0)
              except Exception:
                  return 0.0

          def resolve(entry):
              """Alpha'da varsa (alphaId, bilgi) dondurur, yoksa None. Ayni adli birden fazla token varsa en yuksek 24s hacimliyi secer."""
              if entry.startswith("ALPHA_"):
                  return entry, "dogrudan alpha id"
              live = [t for t in tokens() if not t.get("offline")]
              cands = [t for t in live if str(t.get("symbol", "")).upper() == entry]
              if not cands:
                  cands = [t for t in live if str(t.get("name", "")).upper() == entry]
              if not cands:
                  return None
              best = max(cands, key=vol)
              addr = str(best.get("contractAddress", ""))
              info = f"{best.get('chainName')} {addr[:8]}..{addr[-4:]} hacim24s={vol(best):,.0f}"
              if len(cands) > 1:
                  info += f" ({len(cands)} aday icinden)"
              return best["alphaId"], info

          def make_plan(entry):
              try:
                  r = resolve(entry)
              except Exception as e:
                  log(f"{entry}: token listesi hatasi ({e})")
                  return "retry"
              if r is not None:
                  return ("alpha", r[0], r[1])
              return ("spot", entry, "Binance Spot")

          def fetch(entry, p):
              kind, ident, _info = p
              try:
                  if kind == "alpha":
                      j = http_json(f"{ALPHA_KLINES}?symbol={ident}USDT&interval={INTERVAL}&limit=500")
                      if str(j.get("code")) != "000000":
                          raise RuntimeError(f"klines hatasi: {j.get('message')}")
                      rows = j["data"]
                  else:
                      rows = http_json(f"{SPOT_KLINES}?symbol={ident}USDT&interval={INTERVAL}&limit=500")
                  if MODE != "live":
                      now_ms = int(time.time() * 1000)
                      rows = [x for x in rows if int(x[6]) < now_ms]  # sadece kapanmis mumlar
                  cs = [{"t": int(x[0]), "h": float(x[2]), "l": float(x[3]), "c": float(x[4])} for x in rows]
                  cs.sort(key=lambda k: k["t"])
                  return entry, cs, None
              except Exception as e:
                  return entry, None, e

          def directions(cs):
              n = len(cs)
              if n <= PERIOD + 1:
                  return None
              tr = []
              for i, k in enumerate(cs):
                  if i == 0:
                      tr.append(k["h"] - k["l"])
                  else:
                      pc = cs[i - 1]["c"]
                      tr.append(max(k["h"] - k["l"], abs(k["h"] - pc), abs(k["l"] - pc)))
              atr = [None] * n
              atr[PERIOD - 1] = sum(tr[:PERIOD]) / PERIOD
              for i in range(PERIOD, n):
                  atr[i] = (atr[i - 1] * (PERIOD - 1) + tr[i]) / PERIOD
              dirs = [0] * n
              fu = [None] * n
              fl = [None] * n
              d = 1
              for i in range(PERIOD - 1, n):
                  hl2 = (cs[i]["h"] + cs[i]["l"]) / 2
                  up = hl2 + MULT * atr[i]
                  lo = hl2 - MULT * atr[i]
                  if i == PERIOD - 1:
                      fu[i], fl[i] = up, lo
                  else:
                      pc = cs[i - 1]["c"]
                      fl[i] = lo if (lo > fl[i - 1] or pc < fl[i - 1]) else fl[i - 1]
                      fu[i] = up if (up < fu[i - 1] or pc > fu[i - 1]) else fu[i - 1]
                      c = cs[i]["c"]
                      if d == 1 and c < fl[i]:
                          d = -1
                      elif d == -1 and c > fu[i]:
                          d = 1
                  dirs[i] = d
              return dirs

          def find_flip(cs, dirs):
              """Supertrend su an yesilse ve son 2 mumdan birinde kirmizidan yesile donduyse o mumun indeksi."""
              if dirs is None or dirs[-1] != 1:
                  return None
              n = len(cs)
              now_ms = int(time.time() * 1000)
              for i in (n - 1, n - 2):
                  if i <= PERIOD:
                      continue
                  if dirs[i] == 1 and dirs[i - 1] == -1:
                      age = now_ms - (cs[i]["t"] + INTERVAL_MS)  # mum kapanisindan beri gecen sure (olusan mumda negatif)
                      if age <= FRESH_MS:
                          return i
              return None

          def notify(title, msg, tags="green_circle,chart_with_upwards_trend", priority="high"):
              log(f"[bildirim] {title}: {msg}")
              if not TOPIC:
                  log("NTFY_TOPIC tanimli degil, bildirim gonderilmedi.")
                  return True
              try:
                  req = urllib.request.Request(
                      f"https://ntfy.sh/{TOPIC}",
                      data=msg.encode("utf-8"),
                      headers={"Title": title, "Priority": priority, "Tags": tags},
                      method="POST",
                  )
                  urllib.request.urlopen(req, timeout=15).read()
                  return True
              except Exception as e:
                  log(f"ntfy gonderilemedi ({e})")
                  return False

          def reload_coins():
              """Coin listesini repodaki guncel workflow dosyasindan okur (gun ici degisiklik icin)."""
              try:
                  subprocess.run(["git", "fetch", "--depth", "1", "origin", "HEAD"], check=True, capture_output=True, timeout=30)
                  out = subprocess.run(["git", "show", f"FETCH_HEAD:{WORKFLOW_FILE}"], check=True, capture_output=True, text=True, timeout=15).stdout
              except Exception:
                  return None
              m = re.search(r'^\s*COINS:\s*"([^"]*)"', out, re.M)
              return parse_coins(m.group(1)) if m else None

          def main():
              state = {}
              if os.path.exists(STATE):
                  with open(STATE, encoding="utf-8") as f:
                      state = json.load(f)

              def save():
                  with open(STATE, "w", encoding="utf-8") as f:
                      json.dump(state, f, indent=2)

              coins = parse_coins(os.environ.get("COINS", ""))
              plan = {}
              announced = set()
              last_err = {}
              any_ok = False
              backoff_until = 0.0
              last_sync = 0.0
              start = time.time()
              log(f"basladi: mod={MODE}, {len(coins)} coin, {POLL:g} sn aralik")

              while True:
                  t0 = time.time()

                  if t0 - last_sync >= SYNC:
                      if last_sync:
                          new = reload_coins()
                          if new is not None and new != coins:
                              log(f"coin listesi guncellendi: {','.join(new)}")
                              coins = new
                      last_sync = t0
                      for e in list(plan):
                          if e not in coins:
                              plan.pop(e)
                              announced.discard(e)
                      for e in coins:
                          if plan.get(e) is None:
                              p = make_plan(e)
                              if p != "retry":
                                  plan[e] = p

                  active = [e for e in coins if plan.get(e) is not None]
                  if active and t0 >= backoff_until:
                      with ThreadPoolExecutor(max_workers=8) as ex:
                          results = list(ex.map(lambda e: fetch(e, plan[e]), active))
                      for entry, cs, err in results:
                          s = state.setdefault(entry, {})
                          kind, ident, info = plan[entry]
                          label = f"{entry} ({ident if kind == 'alpha' else 'spot'})"
                          if err is not None:
                              if isinstance(err, urllib.error.HTTPError):
                                  if kind == "spot" and err.code == 400:
                                      log(f"{entry}: Alpha'da da Spot'ta da bulunamadi")
                                      if not s.get("missing_notified"):
                                          if notify(f"BULUNAMADI {entry}", f"{entry} Binance Alpha ve Spot listesinde yok. Yazimi kontrol et.", "warning", "default"):
                                              s["missing_notified"] = True
                                              save()
                                      plan[entry] = None
                                      continue
                                  if err.code in (418, 429):
                                      backoff_until = time.time() + 30
                              msg = f"{type(err).__name__}: {err}"
                              if last_err.get(entry) != msg:
                                  log(f"{label}: veri alinamadi ({msg})")
                                  last_err[entry] = msg
                              continue
                          any_ok = True
                          last_err.pop(entry, None)
                          if s.pop("missing_notified", None):
                              save()
                          if not cs:
                              continue
                          dirs = directions(cs)
                          price = cs[-1]["c"]
                          if entry not in announced:
                              announced.add(entry)
                              durum = "?" if dirs is None else ("yesil" if dirs[-1] == 1 else "kirmizi")
                              log(f"{label}: {info}; son fiyat {price:.8g}; Supertrend simdi: {durum}")
                          idx = find_flip(cs, dirs)
                          if idx is None:
                              continue
                          flip_t = cs[idx]["t"]
                          if flip_t <= s.get("last_flip", 0):
                              continue
                          zaman = datetime.now(TR_TZ).strftime("%H:%M:%S")
                          tip = "anlik" if MODE == "live" else "mum kapanisi"
                          ok_sent = notify(
                              f"SUPERTREND YESIL {entry}",
                              f"{entry} ({kind.capitalize()}) {INTERVAL} Supertrend({PERIOD},{MULT:g}) yesile dondu ({tip}). Saat {zaman}, fiyat {price:.8g} USDT. {info}",
                          )
                          if ok_sent:
                              s["last_flip"] = flip_t
                              save()

                  if time.time() - start + POLL >= RUN_SECONDS:
                      break
                  time.sleep(max(1.0, POLL - (time.time() - t0)))

              save()
              log("dongu bitti, siradaki calisma devralacak")
              if coins and not any_ok:
                  sys.exit(1)

          main()
          PY

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "supertrend-bot"
          git config user.email "supertrend-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
