name: supertrend-bot

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: supertrend
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bot'u calistir
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          pip install requests websockets
          cat > bot.py <<'PYEOF'
          import asyncio
          import json
          import os
          import time
          from concurrent.futures import ThreadPoolExecutor

          import requests
          import websockets

          COINS = [
              c.strip().upper()
              for c in os.getenv(
                  "COINS",
                  "VINE,INIT,AKEDO,ZEUS,ONE,ELIZAOS,ARIA,HOLO,BEAT,EVAA,XRP,SKYAI,PEPE,BMT,PIEVERSE,"
                  "HUMA,ARB,NEIRO,LAB,H,MERL,ACT,PUMP,SIREN,PONS,NEAR,MARS,WLD,EIGEN,PENGU,NAORIS,SUI,"
                  "DODO,NOM,ORDER,AUDIO,DOGE,MET,BIO,TIA,ONDO,FET,TUT,CYBER,COTI,SAGA,RAD,HMSTR,QUBIC,"
                  "LSK,ENJ,BEAMX,PIXEL,RAIN,FORM,CARDS,HBAR,XLM,KAITO,ADA,STRK,LIT,ARKM,DNA,ORDI,PEARL,"
                  "BERA,TOSHI,XPL,SENT,COAI,TAG,XCN,FLOKI,CORE,CHIP,PLUME",
              ).split(",")
              if c.strip()
          ]
          COINS = list(dict.fromkeys(COINS))
          INTERVALS = ["5m", "15m"]
          ATR_PERIOD = int(os.getenv("ATR_PERIOD", "10"))
          MULTIPLIER = float(os.getenv("MULTIPLIER", "3"))
          # live  = mum kapanmadan, band kirildigi an bildirim (en hizli, sahte sinyal riski var)
          # close = mum kapanisinda bildirim (daha guvenilir)
          SIGNAL_ON = os.getenv("SIGNAL_ON", "live").lower()
          NTFY_TOPIC = os.environ["NTFY_TOPIC"]
          NTFY_SERVER = os.getenv("NTFY_SERVER", "https://ntfy.sh")

          SPOT_REST = "https://data-api.binance.vision"
          SPOT_WS = "wss://data-stream.binance.vision/stream"
          ALPHA_REST = "https://www.binance.com/bapi/defi/v1/public"
          ALPHA_WS = "wss://nbstream.binance.com/w3w/wsa/stream"
          UA = {"User-Agent": "Mozilla/5.0"}

          states = {}       # (symbol, interval) -> kapanmis mum state'i
          last_trend = {}   # (symbol, interval) -> bilinen son trend
          NAMES = {}        # borsa sembolu -> gorunen ad
          VENUE = {}        # borsa sembolu -> "spot" | "alpha"


          def step(st, h, l, c):
              pc = st["pc"]
              tr = max(h - l, abs(h - pc), abs(l - pc))
              atr = (st["atr"] * (ATR_PERIOD - 1) + tr) / ATR_PERIOD
              hl2 = (h + l) / 2
              bu = hl2 + MULTIPLIER * atr
              bl = hl2 - MULTIPLIER * atr
              fu = bu if (bu < st["fu"] or pc > st["fu"]) else st["fu"]
              fl = bl if (bl > st["fl"] or pc < st["fl"]) else st["fl"]
              trend = st["trend"]
              if trend == -1 and c > fu:
                  trend = 1
              elif trend == 1 and c < fl:
                  trend = -1
              return {"pc": c, "atr": atr, "fu": fu, "fl": fl, "trend": trend, "t": st.get("t", 0)}


          def get_json(url, **params):
              r = requests.get(url, params=params or None, headers=UA, timeout=30)
              r.raise_for_status()
              return r.json()


          def discover():
              spot_live = {
                  s["symbol"]
                  for s in get_json(f"{SPOT_REST}/api/v3/exchangeInfo")["symbols"]
                  if s["status"] == "TRADING"
              }
              spot, rest = [], []
              for c in COINS:
                  s = c + "USDT"
                  if s in spot_live:
                      spot.append(s)
                      NAMES[s] = c
                      VENUE[s] = "spot"
                  else:
                      rest.append(c)

              alpha, missing, alpha_err = [], [], None
              if rest:
                  try:
                      alpha_live = {
                          s["symbol"]
                          for s in get_json(f"{ALPHA_REST}/alpha-trade/get-exchange-info")["data"]["symbols"]
                          if s["status"] == "TRADING"
                      }
                      tokens = get_json(f"{ALPHA_REST}/wallet-direct/buw/wallet/cex/alpha/all/token/list")["data"]
                      best = {}
                      for t in tokens:
                          if t.get("offline"):
                              continue
                          sym = (t.get("symbol") or "").upper()
                          a = (t.get("alphaId") or "") + "USDT"
                          if a not in alpha_live:
                              continue
                          vol = float(t.get("volume24h") or 0)
                          if sym not in best or vol > best[sym][0]:
                              best[sym] = (vol, a)
                      for c in rest:
                          if c in best:
                              a = best[c][1]
                              alpha.append(a)
                              NAMES[a] = f"{c} (Alpha)"
                              VENUE[a] = "alpha"
                          else:
                              missing.append(c)
                  except Exception as e:  # noqa
                      alpha_err = f"{type(e).__name__}: {e}"
                      missing = rest
              return spot, alpha, missing, alpha_err


          def fetch_klines(symbol, interval):
              if VENUE[symbol] == "spot":
                  return get_json(f"{SPOT_REST}/api/v3/klines", symbol=symbol, interval=interval, limit=500)
              time.sleep(0.15)
              return get_json(f"{ALPHA_REST}/alpha-trade/klines", symbol=symbol, interval=interval, limit=500)["data"]


          def seed(symbol, interval):
              now_ms = int(time.time() * 1000)
              ks = [k for k in fetch_klines(symbol, interval) if int(k[6]) < now_ms]  # sadece kapanmis mumlar
              if len(ks) < ATR_PERIOD + 2:
                  raise RuntimeError("yetersiz veri")
              hlc = [(float(k[2]), float(k[3]), float(k[4])) for k in ks]
              trs = [
                  max(hlc[i][0] - hlc[i][1], abs(hlc[i][0] - hlc[i - 1][2]), abs(hlc[i][1] - hlc[i - 1][2]))
                  for i in range(1, len(hlc))
              ]
              atr = sum(trs[:ATR_PERIOD]) / ATR_PERIOD
              i0 = ATR_PERIOD
              h, l, c = hlc[i0]
              hl2 = (h + l) / 2
              st = {"pc": c, "atr": atr, "fu": hl2 + MULTIPLIER * atr, "fl": hl2 - MULTIPLIER * atr,
                    "trend": 1, "t": int(ks[i0][0])}
              for i in range(i0 + 1, len(hlc)):
                  st = step(st, *hlc[i])
                  st["t"] = int(ks[i][0])
              return (symbol, interval), st


          def safe_seed(symbol, interval):
              err = None
              for _ in range(3):
                  try:
                      return seed(symbol, interval)
                  except Exception as e:  # noqa
                      err = e
                      time.sleep(1)
              print(f"seed basarisiz {symbol} {interval}: {err}", flush=True)
              return None


          async def seed_all(symbols):
              loop = asyncio.get_running_loop()
              with ThreadPoolExecutor(6) as ex:
                  results = await asyncio.gather(
                      *[loop.run_in_executor(ex, safe_seed, s, i) for s in symbols for i in INTERVALS]
                  )
              ok = 0
              for res in results:
                  if res is None:
                      continue
                  key, st = res
                  states[key] = st
                  last_trend[key] = st["trend"]
                  ok += 1
              print(f"seed tamam: {ok}/{len(results)}", flush=True)


          def post_ntfy(title, body, priority="default", tags=""):
              headers = {"Title": title.encode("utf-8"), "Priority": priority}
              if tags:
                  headers["Tags"] = tags
              for _ in range(3):
                  try:
                      requests.post(f"{NTFY_SERVER}/{NTFY_TOPIC}", data=body.encode("utf-8"),
                                    headers=headers, timeout=10).raise_for_status()
                      return
                  except Exception as e:  # noqa
                      print("ntfy hata:", e, flush=True)
                      time.sleep(0.5)


          def notify(symbol, interval, trend, price):
              long_ = trend == 1
              name = NAMES.get(symbol, symbol)
              post_ntfy(
                  f"{name} {interval} SUPERTREND {'LONG' if long_ else 'SHORT'}",
                  f"{'YUKARI' if long_ else 'ASAGI'} donus | Fiyat: {price}",
                  "urgent",
                  "green_circle,chart_with_upwards_trend" if long_ else "red_circle,chart_with_downwards_trend",
              )


          def handle(msg):
              d = msg.get("data", msg) if isinstance(msg, dict) else None
              if not isinstance(d, dict) or d.get("e") != "kline":
                  return
              k = d["k"]
              sym = (d.get("s") or k.get("s") or "").upper()
              key = (sym, k["i"])
              st = states.get(key)
              if st is None or int(k["t"]) <= st["t"]:
                  return
              closed = bool(k["x"])
              if SIGNAL_ON == "close" and not closed:
                  return
              h, l, c = float(k["h"]), float(k["l"]), float(k["c"])
              new = step(st, h, l, c)
              if new["trend"] != last_trend[key]:
                  last_trend[key] = new["trend"]
                  print(f"SINYAL {key} trend={new['trend']} fiyat={k['c']}", flush=True)
                  asyncio.get_running_loop().run_in_executor(None, notify, sym, k["i"], new["trend"], k["c"])
              if closed:
                  new["t"] = int(k["t"])
                  states[key] = new
                  last_trend[key] = new["trend"]


          async def subscribe(ws, symbols):
              params = [f"{s.lower()}@kline_{i}" for s in symbols for i in INTERVALS]
              for n in range(0, len(params), 40):
                  await ws.send(json.dumps({"method": "SUBSCRIBE", "params": params[n:n + 40], "id": n + 1}))
                  await asyncio.sleep(0.3)


          async def run_feed(label, url, symbols):
              while True:
                  try:
                      await seed_all(symbols)
                      async with websockets.connect(url, ping_interval=20, ping_timeout=20, max_size=2**23) as ws:
                          await subscribe(ws, symbols)
                          print(f"[{label}] baglandi: {len(symbols)} coin", flush=True)
                          async for raw in ws:
                              handle(json.loads(raw))
                  except Exception as e:  # noqa
                      print(f"[{label}] baglanti koptu, yeniden deneniyor: {e}", flush=True)
                      await asyncio.sleep(3)


          async def main():
              loop = asyncio.get_running_loop()
              while True:
                  try:
                      spot, alpha, missing, alpha_err = await loop.run_in_executor(None, discover)
                      break
                  except Exception as e:  # noqa
                      print("discover hata:", e, flush=True)
                      await asyncio.sleep(3)
              lines = [f"Spot: {len(spot)} coin | Alpha: {len(alpha)} coin | mod={SIGNAL_ON}"]
              if alpha_err:
                  lines.append(f"Alpha erisilemedi: {alpha_err[:200]}")
              if missing:
                  lines.append(f"Bulunamayan ({len(missing)}): {', '.join(missing)}")
              print("\n".join(lines), flush=True)
              loop.run_in_executor(None, post_ntfy, "Supertrend bot basladi", "\n".join(lines), "default", "white_check_mark")
              tasks = []
              if spot:
                  tasks.append(run_feed("spot", SPOT_WS, spot))
              if alpha:
                  tasks.append(run_feed("alpha", ALPHA_WS, alpha))
              await asyncio.gather(*tasks)


          if __name__ == "__main__":
              asyncio.run(main())
          PYEOF
          python -u bot.py
