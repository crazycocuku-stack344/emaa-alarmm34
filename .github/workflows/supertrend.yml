name: supertrend-ntfy

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supertrend-ntfy
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Supertrend taramasi
        env:
          NTFY_TOPIC_5M: ${{ secrets.NTFY_TOPIC_5M }}
          NTFY_TOPIC_15M: ${{ secrets.NTFY_TOPIC_15M }}
        run: |
          python - <<'EOF'
          #!/usr/bin/env python3
          """Binance spot + Alpha: 5m / 15m Supertrend (ATR 10, carpan 3) YUKARI donusu -> ntfy.

          Kurallar:
          - Sadece kapanmis mumlar kullanilir.
          - Sadece asagidan yukariya donus (yeni yukari trend) bildirilir.
          - Donus son LOOKBACK kapanmis mum icinde olmali VE trend hala yukari olmali.
            (Olusup geri donmus / eskimis sinyaller bildirilmez.)
          - Ayni mum icin ikinci kez bildirim gitmez (state.json).
          """
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timedelta, timezone

          ATR_PERIOD = int(os.getenv("ST_ATR", "10"))
          MULT = float(os.getenv("ST_MULT", "3"))
          LOOKBACK = int(os.getenv("LOOKBACK", "2"))  # kac kapanmis mum geriye kadar "yeni" sayilsin
          LIMIT = 200
          TIMEFRAMES = {"5m": 5 * 60 * 1000, "15m": 15 * 60 * 1000}
          QUOTES = ("USDT", "USDC", "FDUSD", "TUSD", "TRY", "BTC", "ETH", "BNB")
          TR_TZ = timezone(timedelta(hours=3))
          UA = "Mozilla/5.0 (supertrend-ntfy)"
          COINS_TEXT = """
          VINE INIT AKEDO ZEUS ONE ELIZAOS ARIA HOT BEAT EVAA XRP SKYAI PEPE BMT PIEVERSE HUMA ARB NEIRO LAB H MERL ACT PUMP SIREN PONS NEAR WLD EIGEN PENGU NAORIS SUI DODO NOM ORDER AUDIO DOGE MET BIO TIA ONDO FET TUT CYBER COTI SAGA RAD HMSTR QUBIC LSK ENJ BEAMX PIXEL RAIN FORM CARDS HBAR XLM KAITO ADA STRK LIT ARKM DNA ORDI PEARL BERA TOSHI XPL SENT COAI TAG XCN FLOKI CORE CHIP PLUME
          alpha:VINE alpha:INIT alpha:AKEDO alpha:ZEUS alpha:ONE alpha:ELIZAOS alpha:ARIA alpha:HOT alpha:BEAT alpha:EVAA alpha:XRP alpha:SKYAI alpha:PEPE alpha:BMT alpha:PIEVERSE alpha:HUMA alpha:ARB alpha:NEIRO alpha:LAB alpha:H alpha:MERL alpha:ACT alpha:PUMP alpha:SIREN alpha:PONS alpha:NEAR alpha:WLD alpha:EIGEN alpha:PENGU alpha:NAORIS alpha:SUI alpha:DODO alpha:NOM alpha:ORDER alpha:AUDIO alpha:DOGE alpha:MET alpha:BIO alpha:TIA alpha:ONDO alpha:FET alpha:TUT alpha:CYBER alpha:COTI alpha:SAGA alpha:RAD alpha:HMSTR alpha:QUBIC alpha:LSK alpha:ENJ alpha:BEAMX alpha:PIXEL alpha:RAIN alpha:FORM alpha:CARDS alpha:HBAR alpha:XLM alpha:KAITO alpha:ADA alpha:STRK alpha:LIT alpha:ARKM alpha:DNA alpha:ORDI alpha:PEARL alpha:BERA alpha:TOSHI alpha:XPL alpha:SENT alpha:COAI alpha:TAG alpha:XCN alpha:FLOKI alpha:CORE alpha:CHIP alpha:PLUME alpha:MARSCOIN
          """

          SPOT_HOSTS = ["https://data-api.binance.vision", "https://api.binance.com"]
          ALPHA_KLINES = "https://www.binance.com/bapi/defi/v1/public/alpha-trade/klines"
          ALPHA_TOKENS = (
              "https://www.binance.com/bapi/defi/v1/public/wallet-direct/buw/wallet/cex/alpha/all/token/list"
          )


          class SymbolError(Exception):
              pass


          # ---------------------------------------------------------------- HTTP
          def http_json(url, params=None, retries=3, timeout=15):
              if params:
                  url = url + "?" + urllib.parse.urlencode(params)
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": UA})
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except urllib.error.HTTPError as e:
                      last = e
                      if e.code in (400, 404):
                          raise SymbolError(f"HTTP {e.code}")
                      time.sleep(1 + attempt)
                  except Exception as e:  # ag hatasi, timeout, json
                      last = e
                      time.sleep(1 + attempt)
              raise last


          def to_candles(rows, tf_ms):
              """[(open_time, high, low, close)] -> sadece kapanmis mumlar, eskiden yeniye."""
              now_ms = int(time.time() * 1000)
              out = []
              for r in rows:
                  t = int(r[0])
                  if t + tf_ms > now_ms:  # henuz kapanmamis mum
                      continue
                  out.append((t, float(r[2]), float(r[3]), float(r[4])))
              out.sort(key=lambda x: x[0])
              return out


          def fetch_spot(symbol, tf):
              last = None
              for host in SPOT_HOSTS:
                  try:
                      rows = http_json(
                          host + "/api/v3/klines",
                          {"symbol": symbol, "interval": tf, "limit": LIMIT},
                      )
                      return to_candles(rows, TIMEFRAMES[tf])
                  except SymbolError:
                      raise
                  except Exception as e:
                      last = e
              raise last


          def fetch_alpha(symbol, tf):
              j = http_json(ALPHA_KLINES, {"symbol": symbol, "interval": tf, "limit": LIMIT})
              rows = j.get("data") if isinstance(j, dict) else None
              if not isinstance(rows, list) or not rows:
                  raise SymbolError("Alpha: veri yok")
              return to_candles(rows, TIMEFRAMES[tf])


          def fetch(kind, symbol, tf):
              return fetch_spot(symbol, tf) if kind == "spot" else fetch_alpha(symbol, tf)


          # ---------------------------------------------------------------- Supertrend
          def supertrend(c, period=ATR_PERIOD, mult=MULT):
              """TradingView ta.supertrend mantigi (Wilder ATR). 1 = yukari, -1 = asagi, 0 = isinma."""
              n = len(c)
              dirs = [0] * n
              if n <= period + 1:
                  return dirs
              h = [x[1] for x in c]
              lo = [x[2] for x in c]
              cl = [x[3] for x in c]
              tr = [h[0] - lo[0]] + [
                  max(h[i] - lo[i], abs(h[i] - cl[i - 1]), abs(lo[i] - cl[i - 1])) for i in range(1, n)
              ]
              atr = [None] * n
              atr[period - 1] = sum(tr[:period]) / period
              for i in range(period, n):
                  atr[i] = (atr[i - 1] * (period - 1) + tr[i]) / period

              fu = [None] * n
              fl = [None] * n
              for i in range(period - 1, n):
                  hl2 = (h[i] + lo[i]) / 2
                  bu = hl2 + mult * atr[i]
                  bl = hl2 - mult * atr[i]
                  if i == period - 1:
                      fu[i], fl[i], dirs[i] = bu, bl, -1
                      continue
                  fu[i] = bu if (bu < fu[i - 1] or cl[i - 1] > fu[i - 1]) else fu[i - 1]
                  fl[i] = bl if (bl > fl[i - 1] or cl[i - 1] < fl[i - 1]) else fl[i - 1]
                  if dirs[i - 1] == -1:
                      dirs[i] = 1 if cl[i] > fu[i] else -1
                  else:
                      dirs[i] = -1 if cl[i] < fl[i] else 1
              return dirs


          def latest_up_flip(dirs):
              """Son LOOKBACK kapanmis mumda asagi->yukari donus varsa ve trend hala yukariysa index."""
              n = len(dirs)
              if n < 3 or dirs[-1] != 1:
                  return None
              for i in range(n - 1, max(n - 1 - LOOKBACK, 0), -1):
                  if dirs[i] == 1 and dirs[i - 1] == -1:
                      return i
              return None


          # ---------------------------------------------------------------- Coin listesi
          def split_quote(sym):
              for q in QUOTES:
                  if sym.endswith(q) and len(sym) > len(q) + 1:
                      return sym[: -len(q)], q
              return None


          def load_coins():
              items = []
              for line in COINS_TEXT.splitlines():
                  line = line.split("#")[0]
                  for tok in line.replace(",", " ").split():
                      if tok.lower().startswith("alpha:"):
                          name = tok[6:].strip()
                          if name:
                              items.append(("alpha", name))
                      else:
                          s = tok.upper()
                          if not split_quote(s):
                              s += "USDT"
                          items.append(("spot", s))
              return items


          _alpha_map = None


          def resolve_alpha(name):
              """'ALPHA_175' / 'ALPHA_175USDT' dogrudan; 'ZORA' gibi isimler token listesinden bulunur."""
              global _alpha_map
              n = name.upper()
              if n.startswith("ALPHA_"):
                  return n if n.endswith(("USDT", "USDC")) else n + "USDT"
              if _alpha_map is None:
                  data = (http_json(ALPHA_TOKENS) or {}).get("data") or []
                  _alpha_map = {}
                  for t in data:
                      s = (t.get("symbol") or "").upper()
                      a = t.get("alphaId")
                      if s and a:
                          _alpha_map.setdefault(s, a)
              a = _alpha_map.get(n)
              return a + "USDT" if a else None


          # ---------------------------------------------------------------- ntfy
          def send_ntfy(topic, title, body, click=None):
              server = os.getenv("NTFY_SERVER", "https://ntfy.sh").rstrip("/")
              headers = {
                  "Title": title,  # header: sadece ASCII
                  "Tags": "chart_with_upwards_trend",
                  "Priority": "default",
                  "User-Agent": UA,
              }
              if click:
                  headers["Click"] = click
              token = os.getenv("NTFY_TOKEN")
              if token:
                  headers["Authorization"] = "Bearer " + token
              req = urllib.request.Request(
                  f"{server}/{topic}", data=body.encode("utf-8"), headers=headers, method="POST"
              )
              urllib.request.urlopen(req, timeout=15).read()


          # ---------------------------------------------------------------- Ana akis
          def check(job):
              kind, label, sym, tf = job
              candles = fetch(kind, sym, tf)
              dirs = supertrend(candles)
              i = latest_up_flip(dirs)
              if i is None:
                  return None
              return {
                  "kind": kind, "label": label, "sym": sym, "tf": tf,
                  "t": candles[i][0], "price": candles[i][3],
              }


          def load_state(path="state.json"):
              try:
                  with open(path, encoding="utf-8") as f:
                      return json.load(f)
              except (FileNotFoundError, json.JSONDecodeError):
                  return {}


          def main():
              topics = {"5m": os.getenv("NTFY_TOPIC_5M"), "15m": os.getenv("NTFY_TOPIC_15M")}
              topic = topics["5m"] and topics["15m"]
              dry = os.getenv("DRY_RUN") == "1"
              if not topic and not dry:
                  sys.exit("NTFY_TOPIC_5M / NTFY_TOPIC_15M tanimli degil (GitHub Secrets'a ekle).")

              coins = load_coins()
              if not coins:
                  sys.exit("Coin listesi bos.")

              jobs = []
              for kind, name in coins:
                  if kind == "alpha":
                      try:
                          sym = resolve_alpha(name)
                      except Exception as e:
                          print(f"[alpha] token listesi alinamadi ({name}): {e}")
                          continue
                      if not sym:
                          print(f"[alpha] '{name}' token listesinde yok, atlandi")
                          continue
                  else:
                      sym = name
                  for tf in TIMEFRAMES:
                      jobs.append((kind, name if kind == "alpha" else sym, sym, tf))

              state = load_state()
              ok = fail = skipped = sent = 0

              def run(job):
                  try:
                      return job, check(job), None
                  except Exception as e:
                      return job, None, e

              with ThreadPoolExecutor(max_workers=8) as ex:
                  results = list(ex.map(run, jobs))

              for job, sig, err in results:
                  kind, label, sym, tf = job
                  if isinstance(err, SymbolError):
                      skipped += 1  # bu piyasada (spot/alpha) yok, normal
                      continue
                  if err is not None:
                      fail += 1
                      print(f"[hata] {kind}:{sym}:{tf} -> {err}")
                      continue
                  ok += 1
                  if sig is None:
                      continue
                  key = f"{kind}:{sym}:{tf}"
                  if sig["t"] <= state.get(key, 0):
                      continue  # bu mum icin zaten bildirildi

                  close_time = datetime.fromtimestamp((sig["t"] + TIMEFRAMES[tf]) / 1000, TR_TZ)
                  market = "Alpha" if kind == "alpha" else "Spot"
                  title = f"[{tf}] {label} Supertrend UP"
                  body = (
                      f"{label} ({market}) {tf} supertrend yukari dondu\n"
                      f"Fiyat: {sig['price']:.8g}\n"
                      f"Mum kapanisi: {close_time:%H:%M} (TR)"
                  )
                  click = None
                  if kind == "spot":
                      sq = split_quote(sym)
                      if sq:
                          click = f"https://www.binance.com/en/trade/{sq[0]}_{sq[1]}"
                  else:
                      click = "https://www.binance.com/en/alpha"

                  if dry:
                      print(f"[DRY] {title} | {body.replace(chr(10), ' | ')}")
                  else:
                      try:
                          send_ntfy(topics[tf], title, body, click)
                      except Exception as e:
                          print(f"[ntfy hata] {key}: {e}")
                          continue  # state'e yazma, bir sonraki turda tekrar dene
                      state[key] = sig["t"]
                  sent += 1
                  print(f"[sinyal] {key} mum={sig['t']}")

              if not dry:
                  with open("state.json", "w", encoding="utf-8") as f:
                      json.dump(state, f, indent=0, sort_keys=True)

              print(f"taranan={ok} yok_atlandi={skipped} hata={fail} yeni_sinyal={sent}")
              if ok == 0:
                  sys.exit("Hicbir coin icin veri alinamadi.")


          if __name__ == "__main__":
              main()
          EOF

      - name: State kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "state guncelle"
            git pull --rebase
            git push
          fi
