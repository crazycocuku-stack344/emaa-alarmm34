name: EMA Cross Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ema-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: ema-state-${{ github.run_id }}
          restore-keys: ema-state-

      - name: Run bot
        env:
          NTFY_SUFFIX: ${{ secrets.NTFY_SUFFIX }}
        run: python ema_bot.py

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: ema-state-${{ github.run_id }}
