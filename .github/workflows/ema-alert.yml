name: EMA alarm

on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # her 15 dk mum kapanışından 2 dk sonra
  workflow_dispatch:                # elle de çalıştırılabilir

concurrency:
  group: ema-alarm
  cancel-in-progress: false

permissions:
  contents: write                   # state.json'u repoya kaydetmek için

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kesişimleri kontrol et
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python ema_alert.py

      - name: Durumu kaydet
        run: |
          git config user.name "ema-bot"
          git config user.email "ema-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
